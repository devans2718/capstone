[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "Layer-wise probing of frozen audio-JEPA representations (WavJEPA vs wav2vec 2.0 / HuBERT / WavLM)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Model-dependent tests are opt-in: they need the 785 MB checkpoint and a GPU,
# so a bare `pytest` stays fast and runnable anywhere, CI included. A -m on the
# command line overrides this one, so `-m model` runs them in the container.
addopts = "-m 'not model'"
markers = [
    "model: requires an encoder checkpoint (WavJEPA or wav2vec2-base); not runnable in CI",
]
