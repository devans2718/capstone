[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "Layer-wise probing of frozen audio-JEPA representations (WavJEPA vs wav2vec 2.0 / HuBERT / WavLM)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
